# HTTP 默认服务 - 重定向到 HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 用于 Let's Encrypt / acme.sh 验证
    location /.well-known/acme-challenge/ {
        root /home/starclub/StarClub/nginx/html;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 默认服务
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    include snippets/ssl-params.conf;

    # 未匹配任何域名的请求直接拒绝
    return 444;
}