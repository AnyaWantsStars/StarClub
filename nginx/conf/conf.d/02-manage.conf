# 官网管理后台 - manage.starclub.example.com
# 反向代理到 Flask 应用 (127.0.0.1:10240)
# 所有请求（包括 /admin/ 静态文件）均走 Flask 代理以确保认证生效

server {
    listen 80;
    listen [::]:80;
    server_name manage.starclub.example.com;

    location /.well-known/acme-challenge/ {
        root /home/starclub/StarClub/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manage.starclub.example.com;

    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    # 全部请求反向代理到 Flask，由 Flask 负责认证和静态文件服务
    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:10240;

        proxy_intercept_errors on;
    }

    include snippets/error-pages.conf;
}