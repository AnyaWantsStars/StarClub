# 官网 - starclub.example.com / www.starclub.example.com
server {
    listen 80;
    listen [::]:80;
    server_name starclub.example.com www.starclub.example.com;

    location /.well-known/acme-challenge/ {
        root /home/starclub/StarClub/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name starclub.example.com www.starclub.example.com;

    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    root /home/starclub/StarClub/sites/web;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件
    location /uploads/ {
        alias /home/starclub/StarClub/sites/web/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    include snippets/error-pages.conf;
}