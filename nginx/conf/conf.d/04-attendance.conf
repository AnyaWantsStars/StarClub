# 成员出勤 - attendance.starclub.example.com
# 反向代理到 Flask 应用 (127.0.0.1:10242)

server {
    listen 80;
    listen [::]:80;
    server_name attendance.starclub.example.com;

    location /.well-known/acme-challenge/ {
        root /home/starclub/StarClub/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name attendance.starclub.example.com;

    include snippets/ssl-params.conf;
    include snippets/subservice-headers.conf;

    include snippets/error-pages.conf;

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:10242;
    }
}