# 子服务安全响应头（允许任意 starclub.example.com 子域内嵌 iframe）
add_header Content-Security-Policy "frame-ancestors 'self' https://starclub.example.com https://*.starclub.example.com;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 移除上游服务自带的 X-Frame-Options，由 CSP 统一控制嵌入来源。
proxy_hide_header X-Frame-Options;
