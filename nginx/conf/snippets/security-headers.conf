# 安全响应头
# X-Frame-Options 不支持子域通配符，统一改用 CSP frame-ancestors。
add_header Content-Security-Policy "frame-ancestors 'self' https://starclub.example.com https://*.starclub.example.com;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 移除上游服务自带的 X-Frame-Options，避免其覆盖或冲突。
proxy_hide_header X-Frame-Options;
