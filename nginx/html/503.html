<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 - 服务不可用</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8f9fa;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;padding:48px 32px}
.code{font-size:96px;font-weight:700;color:#005a8c;line-height:1;margin-bottom:16px}
.title{font-size:24px;color:#202124;margin-bottom:12px}
.desc{color:#5f6368;margin-bottom:32px;line-height:1.6}
.btn{display:inline-block;padding:12px 32px;background:#005a8c;color:#fff;border-radius:8px;text-decoration:none;font-weight:500;transition:background .2s}
.btn:hover{background:#004c8a}
</style>
</head>
<body>
<div class="container">
<div class="code">503</div>
<h1 class="title">服务暂时不可用</h1>
<p class="desc">服务器暂时无法处理您的请求，请稍后重试。</p>
<a href="/" class="btn">返回首页</a>
</div>
</body>
</html>
