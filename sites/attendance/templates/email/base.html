<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; line-height: 1.6; color: #202124; background: #f8f9fa; }
        .wrapper { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #005a8c, #00a4f8); padding: 24px 30px; text-align: center; }
        .header h1 { color: #ffffff; font-size: 20px; font-weight: bold; margin: 0; }
        .content { padding: 30px; }
        .content p { margin: 0 0 12px 0; font-size: 14px; }
        .info-box { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 8px; padding: 15px; margin: 15px 0; font-size: 13px; }
        .footer { text-align: center; padding: 20px 30px; color: #5f6368; font-size: 12px; border-top: 1px solid #dadce0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>{{ title }}</h1>
        </div>
        <div class="content">
            {{ body }}
        </div>
        <div class="footer">
            <p>星社 · 星社成员出勤平台</p>
        </div>
    </div>
</body>
</html>
