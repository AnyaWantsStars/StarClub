{% extends "base.html" %}
{% block title %}登录 - StarClub | 星社出勤{% endblock %}
{% block body %}
<div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #005a8c 0%, #00a4f8 100%);">
    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); text-align: center; max-width: 400px; width: 90%;">
        <img src="/static/starclub.png" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 20px;">
        <h1 style="font-size: 24px; color: #005a8c; margin-bottom: 10px;">StarClub | 星社出勤</h1>
        <p style="color: #5f6368; margin-bottom: 30px;">正在跳转至统一身份认证...</p>
        <div style="width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #005a8c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px;"></div>
        <p style="font-size: 12px; color: #5f6368;">
            如未自动跳转，请
            <a href="{{ portal_url }}/login?next={{ request.host_url }}attendance" style="color: #005a8c; text-decoration: underline;">点击此处</a>
        </p>
    </div>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
window.location.href = '{{ portal_url }}/login?next={{ request.host_url }}attendance';
</script>
{% endblock %}
