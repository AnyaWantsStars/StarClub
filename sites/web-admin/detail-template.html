<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详情页 - 星社</title>
    <link rel="icon" href="static/starclub.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .detail-page-content { max-width: 900px; margin: 0 auto; }
        .detail-section { margin-bottom: 40px; }
        .detail-section-heading { font-size: 22px; font-weight: 600; color: var(--text-dark); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-color); }
        .detail-section-text { line-height: 1.8; color: var(--text-light); }
        .detail-section-text p { margin-bottom: 12px; }
        .detail-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .detail-card { background: var(--bg-white); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); transition: var(--transition); text-decoration: none; color: inherit; display: block; }
        .detail-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .detail-card-icon { font-size: 32px; margin-bottom: 12px; }
        .detail-card-title { font-size: 16px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .detail-card-desc { font-size: 14px; color: var(--text-light); line-height: 1.6; }
        .detail-card-link { display: inline-block; margin-top: 12px; color: var(--primary-color); font-size: 14px; font-weight: 500; }
        .detail-section-image { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        .detail-section-image img { width: 100%; height: auto; display: block; }
        .detail-section-image .media-caption { padding: 10px 16px; background: var(--bg-gray); color: var(--text-light); font-size: 13px; text-align: center; }
        .detail-section-video { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        .detail-section-video video, .detail-section-video iframe { width: 100%; display: block; }
        .detail-section-video .media-caption { padding: 10px 16px; background: var(--bg-gray); color: var(--text-light); font-size: 13px; text-align: center; }
        .detail-section-audio { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: var(--bg-white); padding: 20px; }
        .detail-section-audio audio { width: 100%; }
        .detail-section-audio .media-caption { padding: 10px 16px; background: var(--bg-gray); color: var(--text-light); font-size: 13px; text-align: center; margin-top: 12px; border-radius: 6px; }
        .detail-section-html { border-radius: 8px; }
        .detail-section-markdown { line-height: 1.8; color: var(--text-dark); }
        .detail-section-markdown h1, .detail-section-markdown h2, .detail-section-markdown h3,
        .detail-section-markdown h4, .detail-section-markdown h5, .detail-section-markdown h6 { margin: 20px 0 10px; color: var(--text-dark); }
        .detail-section-markdown h1 { font-size: 24px; }
        .detail-section-markdown h2 { font-size: 20px; }
        .detail-section-markdown h3 { font-size: 18px; }
        .detail-section-markdown p { margin-bottom: 12px; }
        .detail-section-markdown ul, .detail-section-markdown ol { padding-left: 24px; margin-bottom: 12px; }
        .detail-section-markdown li { margin-bottom: 6px; }
        .detail-section-markdown code { background: var(--bg-gray); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
        .detail-section-markdown pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 16px; }
        .detail-section-markdown pre code { background: none; padding: 0; color: inherit; }
        .detail-section-markdown blockquote { border-left: 4px solid var(--primary-color); padding: 8px 16px; margin: 12px 0; background: var(--bg-gray); border-radius: 0 8px 8px 0; }
        .detail-section-markdown table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .detail-section-markdown th, .detail-section-markdown td { border: 1px solid var(--border-color); padding: 8px 12px; text-align: left; }
        .detail-section-markdown th { background: var(--bg-gray); font-weight: 600; }
        .detail-section-markdown img { max-width: 100%; border-radius: 8px; }
        .detail-section-markdown a { color: var(--primary-color); }
    </style>
</head>
